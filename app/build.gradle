plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kapdatalabs.recettespro'
    compileSdk 34

    defaultConfig {
        applicationId "com.kapdatalabs.recettespro"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Both Sunmi SDKs - the OLD one for the AIDL service, the NEW one for modern API
    implementation 'com.sunmi:printerx:1.0.18'
    implementation 'com.sunmi:printerlibrary:1.0.14'
}
